aid: 4dmedical

name: 4DMedical

description: 4DMedical is a medical imaging technology company with offices in Melbourne, Australia and Los Angeles, California. It produces software and hardware products for non-invasive, quantitative imaging and analysis of lung function, including CT:VQ non-contrast ventilation-perfusion CT, CT LVAS and XV LVAS lung ventilation analysis, IQ-UIP early IPF detection, lung density and texture analysis, pulmonary hypertension assessment, and the XV Scanner for lung function research. It works with health systems, researchers and clinical teams on respiratory and cardiopulmonary imaging. No public developer API or developer portal was found on its site.

